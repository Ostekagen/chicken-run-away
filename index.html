<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Chicken Run Away</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1d2030; overflow: hidden; }
      #game { width: 100%; height: 100%; }
      #rotate { display: none; position: fixed; inset: 0; align-items: center; justify-content: center;
        background: #1d2030; color: #fff; font: 20px monospace; text-align: center; padding: 16px; }
      @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">Turn your device sideways to play</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
